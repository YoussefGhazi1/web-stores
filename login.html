<html>
<head>
    <meta charset="UTF-8">
    <title>Login - Vono</title>
 <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-page">
        <div class="login-box">
            <img src="img/images.png" alt="Vono Logo" class="login-logo">
            <h1>Welcome Back</h1>
            <p class="login-text">  Login to your Vono account</p>
            <form action="Purchase review.html">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required >
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required >
                <div class="login-options">
                    <label class="remember">
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                    <a href="forget.html">Forgot Password?</a>
                </div>
                 <button type="submit"  class="at">
                    Login</button>
            </form>
            
            <p class="create-account">
                Don't have an account?
                <a href="create.html">Create Account</a>
            </p>
        </div>

    </div>

</body>

</html>
